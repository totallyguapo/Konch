<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Konch GIF Switcher</title>
  <style>
    body { text-align: center; background-color: #000; color: white; }
    img { max-width: 90%; margin-top: 20px; }
  </style>
</head>
<body>

<h1>Press SPACE to change GIF</h1>

<!-- THE IMPORTANT <img> TAG -->
<img id="gif" src="" alt="Loading..." />

<!-- YOUR SCRIPT -->
<script>
let gifs = [];
let audio;

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
  if (gifs.length > 0) {
    pickRandomGif();
  }
}

function pickRandomGif() {
  if (gifs.length === 0) return;
  const randomGif = gifs[Math.floor(Math.random() * gifs.length)];
  document.getElementById('gif').src = '/gifs/' + randomGif;
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  const mp3s = await response.json();
  if (mp3s.length > 0) {
    const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
    audio = new Audio('/mp3s/' + randomMp3);
    audio.loop = true;
    audio.play();
  }
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();
    pickRandomGif();
  }
});

window.onload = function() {
  loadGifs();
  loadAudio();
}
</script>

</body>
</html>
