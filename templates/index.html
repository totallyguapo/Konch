<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Press Space</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }

    #spiral-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .spiral-rotator {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: center center;
      animation: spin 60s linear infinite;
      transition: opacity 1s ease, transform 5s ease;
    }

    .spiral-container {
      position: absolute;
      top: 0;
      left: 0;
    }

    img {
      pointer-events: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="spiral-field"></div>

<script>
let gifs = [];
let mp3s = [];
let liveSpirals = [];
let audio = null;

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
}

async function loadMp3s() {
  const response = await fetch('/mp3s');
  mp3s = await response.json();
}

function pickRandomGif() {
  if (gifs.length === 0) return null;
  return gifs[Math.floor(Math.random() * gifs.length)];
}

function pickRandomMp3() {
  if (mp3s.length === 0) return null;
  return mp3s[Math.floor(Math.random() * mp3s.length)];
}

function spawnSpiral(tapX = null, tapY = null) {
  const field = document.getElementById('spiral-field');
  const spiralRotator = document.createElement('div');
  spiralRotator.className = 'spiral-rotator';
  spiralRotator.style.opacity = 0;
  spiralRotator.style.transform = 'scale(0.9)';

  const spiralContainer = document.createElement('div');
  spiralContainer.className = 'spiral-container';
  spiralRotator.appendChild(spiralContainer);
  field.appendChild(spiralRotator);

  const gifSrc = '/gifs/' + pickRandomGif(); // Lock one gif for the spiral

  // Random position
  const padding = 100;
  let x, y;
  if (tapX !== null && tapY !== null) {
    // Use tap location if provided
    x = tapX;
    y = tapY;
  } else {
    // Otherwise random
    x = Math.random() * (window.innerWidth - 2 * padding) + padding;
    y = Math.random() * (window.innerHeight - 2 * padding) + padding;
  }
  spiralRotator.style.left = `${x}px`;
  spiralRotator.style.top = `${y}px`;

  // Random spin
  const spinSpeed = Math.random() * 40 + 20;
  const spinDirection = Math.random() > 0.5 ? 'normal' : 'reverse';
  spiralRotator.style.animation = `spin ${spinSpeed}s linear infinite ${spinDirection}`;

  // Fill spiral with images
  const numTiles = 50;
  let angle = 0;
  let radius = 0;
  const angleStep = 0.3;
  const radiusStep = 5;

  for (let i = 0; i < numTiles; i++) {
    const img = document.createElement('img');
    img.src = gifSrc;
    img.style.position = 'absolute';
    img.style.width = '50px';
    img.style.height = '50px';

    const imgX = Math.cos(angle) * radius;
    const imgY = Math.sin(angle) * radius;
    img.style.left = `${imgX}px`;
    img.style.top = `${imgY}px`;

    spiralContainer.appendChild(img);

    angle += angleStep;
    radius += radiusStep;
  }

  // Fade in + pop-in
  setTimeout(() => {
    spiralRotator.style.opacity = 1;
    if (Math.random() < 0.25) {
      spiralRotator.style.transform = 'scale(1.5)';
    } else {
      spiralRotator.style.transform = 'scale(1)';
    }
  }, 50);

  // Spiral fade-out after time
  const visibleTime = 15000;
  const fadeOutTime = 10000;

  setTimeout(() => {
    spiralRotator.style.transition = 'opacity 10s ease';
    spiralRotator.style.opacity = 0;

    setTimeout(() => {
      if (spiralRotator.parentNode) {
        spiralRotator.parentNode.removeChild(spiralRotator);
        liveSpirals = liveSpirals.filter(s => s !== spiralRotator);
      }
    }, fadeOutTime);
  }, visibleTime);

  liveSpirals.push(spiralRotator);
}

function startNewAudio() {
  if (mp3s.length === 0) return;

  const randomMp3 = pickRandomMp3();
  const newAudio = new Audio('/mp3s/' + randomMp3);
  newAudio.loop = false;
  newAudio.volume = 0.0;

  newAudio.addEventListener('loadedmetadata', () => {
    const duration = newAudio.duration;

    if (!isNaN(duration) && duration > 0) {
      // Pick random start time, anywhere
      let startTime = 0;
      if (duration > 11) {  // needs to be at least 11 seconds long ideally
        startTime = Math.random() * (duration - 11);
      }
      newAudio.currentTime = startTime;

      newAudio.play();

      // 🌟 Fade in from 0 to 1 over 1 second
      const fadeInSteps = 20;
      let fadeInStep = 0;
      const fadeInInterval = setInterval(() => {
        fadeInStep++;
        newAudio.volume = Math.min(1.0, fadeInStep / fadeInSteps);
        if (fadeInStep >= fadeInSteps) {
          clearInterval(fadeInInterval);
          newAudio.volume = 1.0;

          // 🌟 After fade-in finishes, immediately start 10s logarithmic fade-out
          const fadeOutDuration = 10000; // 10 seconds
          const fadeSteps = 100;
          let step = 0;

          const fadeOutInterval = setInterval(() => {
            step++;
            const t = step / fadeSteps;
            const volumeFactor = 1 - Math.log10(9 * t + 1); // Logarithmic curve
            newAudio.volume = Math.max(0.0, volumeFactor);

            if (step >= fadeSteps) {
              clearInterval(fadeOutInterval);
              newAudio.volume = 0.0;
              newAudio.pause(); // 🌟 Stop audio fully after fade out
            }
          }, fadeOutDuration / fadeSteps);
        }
      }, 1000 / fadeInSteps);
    }
  });

  audio = newAudio;
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();

    liveSpirals.forEach(spiral => {
      spiral.style.transition = 'transform 20s ease, opacity 10s ease';
      spiral.style.transform = 'scale(2)';
    });

    spawnSpiral();
    startNewAudio();
  }
});

  document.addEventListener('touchstart', function(event) {
  event.preventDefault();
    
  const touch = event.touches[0];
  const tapX = touch.clientX;
  const tapY = touch.clientY;
    
  liveSpirals.forEach(spiral => {
    spiral.style.transition = 'transform 20s ease, opacity 10s ease';
    spiral.style.transform = 'scale(2)';
  });

  spawnSpiral(tapX, tapY);
  startNewAudio();
});

window.onload = async function() {
  await loadGifs();
  await loadMp3s();
  spawnSpiral();
  startNewAudio();
};
</script>

</body>
</html>
