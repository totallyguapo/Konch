<!doctype html>
<html>
<head>
  <title>GIF & MP3 Gallery</title>
</head>
<body>
  <h1>Upload a GIF or MP3</h1>
  <form method=post enctype=multipart/form-data>
    <input type=file name=file>
    <input type=submit value=Upload>
  </form>

  <h2>GIFs</h2>
  {% for gif in gifs %}
    <img src="{{ url_for('uploaded_file', filename=gif) }}" width="300">
  {% endfor %}

  <h2>MP3s</h2>
  {% for mp3 in mp3s %}
    <audio controls>
      <source src="{{ url_for('uploaded_file', filename=mp3) }}" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <br>
  {% endfor %}
</body>
</html>
