<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Press Space</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }

    #spiral-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .spiral-rotator {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: center center;
      animation: spin 60s linear infinite;
      transition: opacity 1s ease, transform 5s ease; /* pop in + fade */
    }

    .spiral-container {
      position: absolute;
      top: 0;
      left: 0;
    }

    img {
      pointer-events: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="spiral-field"></div>

<script>
let gifs = [];
let liveSpirals = []; // Keep track of all spirals on the screen

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
}

function pickRandomGif() {
  if (gifs.length === 0) return null;
  return gifs[Math.floor(Math.random() * gifs.length)];
}

function spawnSpiral() {
  const field = document.getElementById('spiral-field');
  const spiralRotator = document.createElement('div');
  spiralRotator.className = 'spiral-rotator';
  spiralRotator.style.opacity = 0;
  spiralRotator.style.transform = 'scale(0.9)';

  const spiralContainer = document.createElement('div');
  spiralContainer.className = 'spiral-container';
  spiralRotator.appendChild(spiralContainer);
  field.appendChild(spiralRotator);

  // Random position
  const padding = 100;
  const x = Math.random() * (window.innerWidth - 2 * padding) + padding;
  const y = Math.random() * (window.innerHeight - 2 * padding) + padding;
  spiralRotator.style.left = `${x}px`;
  spiralRotator.style.top = `${y}px`;

  // Random spin speed and direction
  const spinSpeed = Math.random() * 40 + 20;
  const spinDirection = Math.random() > 0.5 ? 'normal' : 'reverse';
  spiralRotator.style.animation = `spin ${spinSpeed}s linear infinite ${spinDirection}`;

  // Fill the spiral with images
  const numTiles = 50;
  let angle = 0;
  let radius = 0;
  const angleStep = 0.3;
  const radiusStep = 5;
  const gifSrc = '/gifs/' + pickRandomGif();

  for (let i = 0; i < numTiles; i++) {
    const img = document.createElement('img');
    img.src = gifSrc;
    img.style.position = 'absolute';
    img.style.width = '50px';
    img.style.height = '50px';

    const imgX = Math.cos(angle) * radius;
    const imgY = Math.sin(angle) * radius;

    img.style.left = `${imgX}px`;
    img.style.top = `${imgY}px`;

    spiralContainer.appendChild(img);

    angle += angleStep;
    radius += radiusStep;
  }

  // Fade in + pop-in
 setTimeout(() => {
  spiralRotator.style.opacity = 1;

  if (Math.random() < 0.25) {
    // 🌟 25% chance: pop-in bigger
    spiralRotator.style.transform = 'scale(2)';
  } else {
    // 75% normal pop-in
    const randomScale = 1 + Math.random() * 0.5; // random between 1.0 and 1.5
  spiralRotator.style.transform = `scale(${randomScale})`;
  }
}, 50);

  // Spiral manages its own lifetime
  const visibleTime = 15000; // 15s fully visible
  const fadeOutTime = 10000; // 10s fade out

  setTimeout(() => {
    spiralRotator.style.transition = 'opacity 10s ease';
    spiralRotator.style.opacity = 0;

    setTimeout(() => {
      if (spiralRotator.parentNode) {
        spiralRotator.parentNode.removeChild(spiralRotator);
        liveSpirals = liveSpirals.filter(s => s !== spiralRotator); // Clean up list
      }
    }, fadeOutTime);
  }, visibleTime);

  // Add to live spirals list
  liveSpirals.push(spiralRotator);
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();

    // Tell all existing spirals to start growing
    liveSpirals.forEach(spiral => {
      spiral.style.transition = 'transform 20s ease, opacity 10s ease'; // Slow big grow
      spiral.style.transform = 'scale(2)'; // Grow to double size
    });

    spawnSpiral(); // Spawn new spiral
  }
});

window.onload = async function() {
  await loadGifs();
  spawnSpiral(); // spawn the first spiral automatically
};
</script>

</body>
</html>
