<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Press Space</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }

    #spiral-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .spiral-rotator {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: center center;
      animation: spin 60s linear infinite;
      transition: opacity 1s ease, transform 1s ease; /* opacity and pop-in */
    }

    .spiral-container {
      position: absolute;
      top: 0;
      left: 0;
    }

    img {
      pointer-events: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="spiral-field"></div>

<script>
let gifs = [];
let mp3s = [];
let audio = null;
let lastSpiral = null;

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  mp3s = await response.json();
}

function pickRandomGif() {
  if (gifs.length === 0) return null;
  return gifs[Math.floor(Math.random() * gifs.length)];
}

function startNewAudio() {
  if (mp3s.length === 0) return;

  const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
  const newAudio = new Audio('/mp3s/' + randomMp3);
  newAudio.loop = true;
  newAudio.volume = 0.0;
  newAudio.play();

  const fadeInDuration = 4000;
  const fadeInInterval = setInterval(() => {
    if (newAudio.volume < 0.95) {
      newAudio.volume += 0.02;
    } else {
      newAudio.volume = 1.0;
      clearInterval(fadeInInterval);
    }
  }, fadeInDuration / 50);

  if (audio) {
    const oldAudio = audio;
    const fadeOutDuration = 4000;
    const fadeOutInterval = setInterval(() => {
      if (oldAudio.volume > 0.02) {
        oldAudio.volume -= 0.02;
      } else {
        oldAudio.pause();
        clearInterval(fadeOutInterval);
      }
    }, fadeOutDuration / 50);
  }

  audio = newAudio;
}

function spawnSpiral() {
  const field = document.getElementById('spiral-field');
  const spiralRotator = document.createElement('div');
  spiralRotator.className = 'spiral-rotator';
  spiralRotator.style.opacity = 0;
  spiralRotator.style.transform = 'scale(0.9)'; // Pop in from smaller

  const spiralContainer = document.createElement('div');
  spiralContainer.className = 'spiral-container';

  spiralRotator.appendChild(spiralContainer);
  field.appendChild(spiralRotator);

  // Random position
  const padding = 100;
  const x = Math.random() * (window.innerWidth - 2 * padding) + padding;
  const y = Math.random() * (window.innerHeight - 2 * padding) + padding;
  spiralRotator.style.left = `${x}px`;
  spiralRotator.style.top = `${y}px`;

  // Random spin speed and direction
  const spinSpeed = Math.random() * 40 + 20;
  const spinDirection = Math.random() > 0.5 ? 'normal' : 'reverse';
  spiralRotator.style.animation = `spin ${spinSpeed}s linear infinite ${spinDirection}`;

  // Create spiral images
  const numTiles = 50;
  let angle = 0;
  let radius = 0;
  const angleStep = 0.3;
  const radiusStep = 5;
  const gifSrc = '/gifs/' + pickRandomGif();

  for (let i = 0; i < numTiles; i++) {
    const img = document.createElement('img');
    img.src = gifSrc;
    img.style.position = 'absolute';
    img.style.width = '50px';
    img.style.height = '50px';

    const imgX = Math.cos(angle) * radius;
    const imgY = Math.sin(angle) * radius;

    img.style.left = `${imgX}px`;
    img.style.top = `${imgY}px`;

    spiralContainer.appendChild(img);

    angle += angleStep;
    radius += radiusStep;
  }

  // 🌟 Fade in + pop in
  setTimeout(() => {
    spiralRotator.style.opacity = 1;
    spiralRotator.style.transform = 'scale(1)';
  }, 50);

  lastSpiral = spiralRotator;
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();

    if (lastSpiral) {
      lastSpiral.style.opacity = 0; // 🌟 Fade out old spiral
      setTimeout(() => {
        if (lastSpiral.parentNode) {
          lastSpiral.parentNode.removeChild(lastSpiral);
        }
      }, 10000); // 🌟 Remove after 10 seconds
    }

    spawnSpiral();
    startNewAudio();
  }
});

window.onload = async function() {
  await loadGifs();
  await loadAudio();
  spawnSpiral(); // Spawn the first spiral immediately
};
</script>

</body>
</html>
