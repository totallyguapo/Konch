<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Press Space</title>
 <style>
body {
  margin: 0;
  overflow: hidden;
  background-color: black;
  color: white;
}
h1 {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  color: white;
  z-index: 10;
}
#spiral-rotator {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: spin 60s linear infinite; /* 🌪️ This spins the spiral */
}
#spiral-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
img {
  pointer-events: none;
}

/* Keyframes for slow spin */
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div id="spiral-rotator">
  <div id="spiral-container"></div>
</div>

<!-- YOUR SCRIPT -->
<script>
let gifs = [];
let audio = null;
let lastGif = null;
let mp3s = [];

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
  if (gifs.length > 0) {
    pickRandomGif();
  }
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  mp3s = await response.json();
  if (mp3s.length > 0) {
    startNewAudio();
  }
}

function pickRandomGif() {
  if (gifs.length === 0) return;

  let newGif;
  do {
    newGif = gifs[Math.floor(Math.random() * gifs.length)];
  } while (newGif === lastGif && gifs.length > 1);

  lastGif = newGif;
  createSpiral('/gifs/' + newGif);
}

function startNewAudio() {
  if (mp3s.length === 0) return;

  const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
  const newAudio = new Audio('/mp3s/' + randomMp3);
  newAudio.loop = true;
  newAudio.volume = 0.0;
  newAudio.play();

  // Fade in new audio
  const fadeInDuration = 1000; // 1 sec
  const fadeInInterval = setInterval(() => {
    if (newAudio.volume < 0.95) {
      newAudio.volume += 0.05;
    } else {
      newAudio.volume = 1.0;
      clearInterval(fadeInInterval);
    }
  }, fadeInDuration / 20);

  // If there’s an existing audio, fade it out
  if (audio) {
    const oldAudio = audio;
    const fadeOutDuration = 1000; // 1 sec
    const fadeOutInterval = setInterval(() => {
      if (oldAudio.volume > 0.05) {
        oldAudio.volume -= 0.05;
      } else {
        oldAudio.pause();
        clearInterval(fadeOutInterval);
      }
    }, fadeOutDuration / 20);
  }

  // Switch to the new audio
  audio = newAudio;
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();
    pickRandomGif();
    startNewAudio();
  }
});

window.onload = function() {
  loadGifs();
  loadAudio();
};
</script>

</body>
</html>
