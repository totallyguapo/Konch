<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Press Space</title>
 <style>
body {
  margin: 0;
  overflow: hidden;
  background-color: black;
  color: white;
}
h1 {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  color: white;
  z-index: 10;
}
#spiral-rotator {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: spin 60s linear infinite; /* 🌪️ This spins the spiral */
}
#spiral-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
img {
  pointer-events: none;
}

/* Keyframes for slow spin */
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div id="spiral-rotator">
  <div id="spiral-container"></div>
</div>

<!-- YOUR SCRIPT -->
<script>
let gifs = [];
let audio = null;
let lastGif = null;
let mp3s = [];

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
  if (gifs.length > 0) {
    pickRandomGif();
  }
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  mp3s = await response.json();
  // ⛔ Do not play anything yet! Wait for Spacebar press.
}

function pickRandomGif() {
  if (gifs.length === 0) return;

  let newGif;
  do {
    newGif = gifs[Math.floor(Math.random() * gifs.length)];
  } while (newGif === lastGif && gifs.length > 1);

  lastGif = newGif;
  createSpiral('/gifs/' + newGif);
}

function createSpiral(gifSrc) {
  const container = document.getElementById('spiral-container');
  container.innerHTML = ''; // Clear previous gifs

  const numTiles = 50;
  let angle = 0;
  let radius = 0;
  const angleStep = 0.3;
  const radiusStep = 5;

  for (let i = 0; i < numTiles; i++) {
    const img = document.createElement('img');
    img.src = gifSrc;
    img.style.position = 'absolute';
    img.style.width = '50px';
    img.style.height = '50px';

    const x = Math.cos(angle) * radius + window.innerWidth / 2;
    const y = Math.sin(angle) * radius + window.innerHeight / 2;

    img.style.left = `${x}px`;
    img.style.top = `${y}px`;

    container.appendChild(img);

    angle += angleStep;
    radius += radiusStep;
  }
}

function startNewAudio() {
  if (mp3s.length === 0) return;

  const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
  const newAudio = new Audio('/mp3s/' + randomMp3);
  newAudio.loop = true;
  newAudio.volume = 0.0;
  newAudio.play();

  // Fade in the new audio
  const fadeInDuration = 1000; // 1 second
  const fadeInInterval = setInterval(() => {
    if (newAudio.volume < 0.95) {
      newAudio.volume += 0.05;
    } else {
      newAudio.volume = 1.0;
      clearInterval(fadeInInterval);
    }
  }, fadeInDuration / 20);

  // Fade out the old audio
  if (audio) {
    const oldAudio = audio;
    const fadeOutDuration = 1000; // 1 second
    const fadeOutInterval = setInterval(() => {
      if (oldAudio.volume > 0.05) {
        oldAudio.volume -= 0.05;
      } else {
        oldAudio.pause();
        clearInterval(fadeOutInterval);
      }
    }, fadeOutDuration / 20);
  }

  audio = newAudio; // Set the new audio as the current one
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();
    pickRandomGif();
    startNewAudio();
  }
});

window.onload = function() {
  loadGifs();
  loadAudio();
};
</script>

</body>
</html>
