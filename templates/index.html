<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Konch Spiral GIFs</title>
 <style>
body {
  margin: 0;
  overflow: hidden;
  background-color: black;
  color: white;
}
h1 {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  color: white;
  z-index: 10;
}
#spiral-rotator {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: spin 60s linear infinite; /* 🌪️ This spins the spiral */
}
#spiral-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
img {
  pointer-events: none;
}

/* Keyframes for slow spin */
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>
</head>
<body>

<h1>Press SPACE to change GIF</h1>
<div id="spiral-rotator">
  <div id="spiral-container"></div>
</div>

<!-- YOUR SCRIPT -->
<script>
let gifs = [];
let audio;
let lastGif = null;

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
  if (gifs.length > 0) {
    pickRandomGif();
  }
}

function pickRandomGif() {
  if (gifs.length === 0) return;

  let newGif;
  do {
    newGif = gifs[Math.floor(Math.random() * gifs.length)];
  } while (newGif === lastGif && gifs.length > 1);

  lastGif = newGif;

  createSpiral('/gifs/' + newGif);
}

function createSpiral(gifSrc) {
  const container = document.getElementById('spiral-container');
  container.innerHTML = ''; // Clear old gifs

  const numTiles = 50; // How many gif tiles
  let angle = 0;
  let radius = 0;
  const angleStep = 0.3; // smaller = tighter spiral
  const radiusStep = 5;  // controls how spread out

  for (let i = 0; i < numTiles; i++) {
    const img = document.createElement('img');
    img.src = gifSrc;
    img.style.position = 'absolute';
    img.style.width = '50px';
    img.style.height = '50px';

    // Calculate x, y position
    const x = Math.cos(angle) * radius + window.innerWidth / 2;
    const y = Math.sin(angle) * radius + window.innerHeight / 2;

    img.style.left = `${x}px`;
    img.style.top = `${y}px`;

    container.appendChild(img);

    angle += angleStep;
    radius += radiusStep;
  }
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  const mp3s = await response.json();
  if (mp3s.length > 0) {
    const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
    audio = new Audio('/mp3s/' + randomMp3);
    audio.loop = true;
  }
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();
    pickRandomGif();
    if (audio && audio.paused) {
      audio.play();
    }
  }
});

window.onload = function() {
  loadGifs();
  loadAudio();
};
</script>

</body>
</html>
