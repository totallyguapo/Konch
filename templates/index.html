<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Konch Spiral GIFs</title>
 <style>
body {
  margin: 0;
  overflow: hidden;
  background-color: black;
  color: white;
}
h1 {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  color: white;
  z-index: 10;
}
#spiral-rotator {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  animation: spin 60s linear infinite; /* 🌪️ This spins the spiral */
}
#spiral-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
img {
  pointer-events: none;
}

/* Keyframes for slow spin */
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
</style>
</head>
<body>

<h1>Press SPACE to change GIF</h1>
<div id="spiral-rotator">
  <div id="spiral-container"></div>
</div>

<!-- YOUR SCRIPT -->
<script>
let gifs = [];
let audio = null;
let lastGif = null;
let mp3s = [];

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
  if (gifs.length > 0) {
    pickRandomGif();
  }
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  mp3s = await response.json();
  if (mp3s.length > 0) {
    audio = new Audio('/mp3s/' + mp3s[Math.floor(Math.random() * mp3s.length)]);
    audio.loop = true;
    audio.volume = 1.0;
    audio.play();
  }
}

function pickRandomGif() {
  if (gifs.length === 0) return;

  let newGif;
  do {
    newGif = gifs[Math.floor(Math.random() * gifs.length)];
  } while (newGif === lastGif && gifs.length > 1);

  lastGif = newGif;

  createSpiral('/gifs/' + newGif);
}

function pickRandomAudio() {
  if (mp3s.length === 0) return;

  const fadeDuration = 1000; // 1 second

  // Fade out current audio
  if (audio) {
    const currentAudio = audio;
    const fadeOutInterval = setInterval(() => {
      if (currentAudio.volume > 0.05) {
        currentAudio.volume -= 0.05;
      } else {
        clearInterval(fadeOutInterval);
        currentAudio.pause();
      }
    }, fadeDuration / 20);
  }

  // Load new random audio
  const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
  const newAudio = new Audio('/mp3s/' + randomMp3);
  newAudio.loop = true;
  newAudio.volume = 0.0; // start silent
  newAudio.play();

  // Fade in new audio
  const fadeInInterval = setInterval(() => {
    if (newAudio.volume < 0.95) {
      newAudio.volume += 0.05;
    } else {
      clearInterval(fadeInInterval);
      newAudio.volume = 1.0;
    }
  }, fadeDuration / 20);

  audio = newAudio; // replace the old audio reference
}

document.addEventListener('keydown', function(event) {
  if (event.code === 'Space') {
    event.preventDefault();
    pickRandomGif();
    pickRandomAudio();
  }
});

window.onload = function() {
  loadGifs();
  loadAudio();
};
</script>

</body>
</html>
