<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Press Space</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background-color: black;
  color: white;
}
#spiral-rotator {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform-origin: center center;
  animation: spin 60s linear infinite normal;
  transition: opacity 1s ease;
  opacity: 1;
}
#spiral-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
img {
  pointer-events: none;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div id="spiral-rotator">
  <div id="spiral-container"></div>
</div>

<!-- YOUR SCRIPT -->
<script>
let gifs = [];
let audio = null;
let lastGif = null;
let mp3s = [];
let centerX = window.innerWidth / 2;
let centerY = window.innerHeight / 2;
let isFirstSpiral = true;

async function loadGifs() {
  const response = await fetch('/gifs');
  gifs = await response.json();
  if (gifs.length > 0) {
    pickRandomGif();
  }
}

async function loadAudio() {
  const response = await fetch('/mp3s');
  mp3s = await response.json();
  // ⛔ Do not play anything yet! Wait for Spacebar press.
}

function pickRandomGif() {
  if (gifs.length === 0) return;

  let newGif;
  do {
    newGif = gifs[Math.floor(Math.random() * gifs.length)];
  } while (newGif === lastGif && gifs.length > 1);

  lastGif = newGif;
  createSpiral('/gifs/' + newGif);
}

function createSpiral(gifSrc) {
  const container = document.getElementById('spiral-container');

  // 🌟 Fade out old gifs
  const oldGifs = container.querySelectorAll('img');
  oldGifs.forEach(img => {
    img.style.transition = 'opacity 10s ease';
    img.style.opacity = '0';
    setTimeout(() => {
      if (img.parentNode) {
        img.parentNode.removeChild(img);
      }
    }, 10000);
  });

  const numTiles = 50;
  let angle = 0;
  let radius = 0;
  const angleStep = 0.3;
  const radiusStep = 5;

  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  for (let i = 0; i < numTiles; i++) {
    const img = document.createElement('img');
    img.src = gifSrc;
    img.style.position = 'absolute';
    img.style.width = '50px';
    img.style.height = '50px';
    img.style.opacity = '1'; // Start fully visible

    const x = Math.cos(angle) * radius + centerX;
    const y = Math.sin(angle) * radius + centerY;

    img.style.left = `${x}px`;
    img.style.top = `${y}px`;

    container.appendChild(img);

    angle += angleStep;
    radius += radiusStep;
  }

  // 🌟 Shift the entire spiral-container randomly
  if (!isFirstSpiral) {
    const maxOffset = 500;
    const offsetX = Math.random() * maxOffset * 2 - maxOffset; // -500 to +500
    const offsetY = Math.random() * maxOffset * 2 - maxOffset;
    container.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  } else {
    // First spiral centered
    container.style.transform = `translate(0px, 0px)`;
    isFirstSpiral = false;
  }
}

function startNewAudio() {
  if (mp3s.length === 0) return;

  const randomMp3 = mp3s[Math.floor(Math.random() * mp3s.length)];
  const newAudio = new Audio('/mp3s/' + randomMp3);
  newAudio.loop = true;
  newAudio.volume = 0.0;
  newAudio.play();

  // Fade in the new audio
  const fadeInDuration = 4000; // 1 second
  const fadeInInterval = setInterval(() => {
    if (newAudio.volume < 0.95) {
      newAudio.volume += 0.05;
    } else {
      newAudio.volume = 1.0;
      clearInterval(fadeInInterval);
    }
  }, fadeInDuration / 20);

  // Fade out the old audio
  if (audio) {
    const oldAudio = audio;
    const fadeOutDuration = 4000; // 1 second
    const fadeOutInterval = setInterval(() => {
      if (oldAudio.volume > 0.05) {
        oldAudio.volume -= 0.05;
      } else {
        oldAudio.pause();
        clearInterval(fadeOutInterval);
      }
    }, fadeOutDuration / 20);
  }

  audio = newAudio; // Set the new audio as the current one
}

document.addEventListener('keydown', async function(event) {
  if (event.code === 'Space') {
    event.preventDefault();
 const spiralRotator = document.getElementById('spiral-rotator');
    spiralRotator.style.opacity = 0;

    // Wait for fade-out to finish (~1 second)
    await new Promise(resolve => setTimeout(resolve, 1000));

    // Change GIF and Audio
    pickRandomGif();
    startNewAudio();

      const spinSpeed = Math.random() * 40 + 20; // between 20s and 60s
    const spinDirection = Math.random() > 0.5 ? 'normal' : 'reverse';
    spiralRotator.style.animation = `spin ${spinSpeed}s linear infinite ${spinDirection}`;

    // 🌟 FADE IN
    spiralRotator.style.opacity = 1;
  }
});

window.onload = function() {
  loadGifs();
  loadAudio();
};
</script>

</body>
</html>
